<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .rps-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .rps-container h1 {
            color: #1e3c72;
            margin-bottom: 20px;
        }
        .rps-scores {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .rps-score-item {
            font-size: 1.1em;
        }
        .rps-score-item strong {
            font-size: 1.5em;
            display: block;
            margin-top: 5px;
        }
        .rps-choices {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .rps-choice-form {
             margin: 0;
        }
        .rps-choice-btn {
            padding: 15px 20px;
            font-size: 2em; /* Larger icons */
            border: none;
            border-radius: 50%; /* Circle */
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
         .rps-choice-btn .fas {
             margin: 0; /* Override potential margin */
         }
        .rps-choice-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        .rock { background: linear-gradient(135deg, #8d6e63, #795548); } /* Brownish */
        .paper { background: linear-gradient(135deg, #4fc3f7, #29b6f6); } /* Light Blue */
        .scissors { background: linear-gradient(135deg, #e57373, #ef5350); } /* Reddish */

        .rps-result {
            margin-top: 30px;
            padding: 20px;
            background: #e9ecef;
            border-radius: 8px;
            min-height: 100px; /* Ensure space even if no result */
            text-align: center;
        }
         .rps-result p {
             margin: 5px 0;
             font-size: 1.1em;
         }
        .result-win { color: #28a745; font-weight: bold; }
        .result-lose { color: #dc3545; font-weight: bold; }
        .result-draw { color: #6c757d; font-weight: bold; }
        .choice-icon { margin: 0 5px;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-gamepad"></i> Game Hub
        </div>
        <div class="nav-items">
            <a href="/game-hub" class="nav-link">
                <i class="fas fa-arrow-left"></i> Back to Hub
            </a>
        </div>
    </nav>

    <div class="rps-container">
        <h1>Rock Paper Scissors</h1>

        <!-- Scores -->
        <div class="rps-scores">
            <div class="rps-score-item">Player <strong th:text="${scores.player}">0</strong></div>
            <div class="rps-score-item">Draws <strong th:text="${scores.draws}">0</strong></div>
            <div class="rps-score-item">CPU <strong th:text="${scores.cpu}">0</strong></div>
        </div>

        <!-- Player Choices -->
        <div class="rps-choices">
            <form th:action="@{/rps/play}" method="post" class="rps-choice-form">
                <input type="hidden" name="playerChoice" value="ROCK">
                <button type="submit" class="rps-choice-btn rock" title="Rock">
                    <i class="fas fa-hand-rock"></i>
                </button>
            </form>
            <form th:action="@{/rps/play}" method="post" class="rps-choice-form">
                <input type="hidden" name="playerChoice" value="PAPER">
                <button type="submit" class="rps-choice-btn paper" title="Paper">
                    <i class="fas fa-hand-paper"></i>
                </button>
            </form>
            <form th:action="@{/rps/play}" method="post" class="rps-choice-form">
                <input type="hidden" name="playerChoice" value="SCISSORS">
                <button type="submit" class="rps-choice-btn scissors" title="Scissors">
                    <i class="fas fa-hand-scissors"></i>
                </button>
            </form>
        </div>

        <!-- Result Display -->
        <div class="rps-result" th:if="${lastResult != null}">
             <p>
                 You chose <span th:text="${lastResult.playerChoice}" class="choice-icon"></span>,
                 CPU chose <span th:text="${lastResult.cpuChoice}" class="choice-icon"></span>.
             </p>
             <p th:switch="${lastResult.result}">
                 <span th:case="'PLAYER_WINS'" class="result-win">You Win! 🎉</span>
                 <span th:case="'CPU_WINS'" class="result-lose">CPU Wins! 😞</span>
                 <span th:case="'DRAW'" class="result-draw">It's a Draw! 🤝</span>
             </p>
        </div>
         <div class="rps-result" th:if="${lastResult == null}">
             <p>Make your choice!</p>
         </div>

    </div>

</body>
</html>
