<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Game Hub</title>
    <!-- Link external CSS from tictac.html -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Use navbar structure and classes from tictac.html -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-gamepad"></i> Game Hub
        </div>
        <div class="nav-items">
            <!-- Logout Form using classes from tictac.html -->
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="nav-logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </div>
    </nav>

    <!-- Use the specific container class -->
    <div class="game-hub-container">
        <div class="welcome-section">
            <h1>Welcome to Game Hub</h1>
            <p>Hello, <span class="username" th:text="${username}">User</span>!</p>
        </div>

        <div class="game-options">
            <!-- Ensure these use the correct game-card class from style.css -->
            <a href="/tictac/select" class="game-card tictac-card">
                <div class="game-icon">⭕</div>
                <div class="game-title">Tic Tac Toe</div>
                <div class="game-description">Classic game of X's and O's</div>
            </a>

            <a href="/chess" class="game-card chess-card">
                <div class="game-icon">♟️</div>
                <div class="game-title">Chess</div>
                <div class="game-description">Strategic board game</div>
            </a>

            <!-- Add Rock Paper Scissors Card -->
            <a href="/rps" class="game-card rps-card">
                <!-- Using Font Awesome icons for consistency -->
                <div class="game-icon"><i class="fas fa-hand-rock"></i><i class="fas fa-hand-paper"></i></div> 
                <div class="game-title">Rock Paper Scissors</div>
                <div class="game-description">Classic hand game</div>
            </a>
        </div>
    </div>
</body>
</html>
